<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>BeneSosta — Informativa privacy</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1d23;
    --muted: #4a5160;
    --line: #d5d9e0;
    --accent: #0046e0;
    --panel: #f3f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --text: #e8eaee;
      --muted: #b4bac6;
      --line: #383d47;
      --accent: #8fb0ff;
      --panel: #1c1f25;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem 2rem; }
  header { margin-bottom: 2rem; }
  .brand { font-size: 2rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .tagline { color: var(--muted); margin: 0.25rem 0 0; font-size: 1.125rem; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem 1.25rem 1.5rem; }
  h1 { font-size: 1.4rem; line-height: 1.3; margin: 0 0 0.75rem; }
  p { margin: 0 0 1rem; }
  dl { margin: 1.25rem 0 0; display: grid; gap: 0.75rem; }
  dt { color: var(--muted); font-size: 0.95rem; }
  dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  a { color: var(--accent); text-underline-offset: 0.15em; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <p class="brand">BeneSosta</p>
    <p class="tagline">La tua sosta, più semplice.</p>
  </header>
  <section aria-labelledby="titolo">
    <h1 id="titolo">Informativa privacy</h1>
    <p>L'informativa privacy definitiva sarà disponibile prima della distribuzione pubblica dell'app.</p>
    <dl>
      <div>
        <dt>Per informazioni</dt>
        <dd><a href="mailto:barmast@gmail.com">barmast@gmail.com</a></dd>
      </div>
      <div>
        <dt>Titolare</dt>
        <dd>Stefano Mastrocinque</dd>
      </div>
    </dl>
  </section>
</main>
</body>
</html>
